<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문제4. 이미지 슬라이더 (빈칸 채우기)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ============================================
  [문제 4] 빈칸 채우기 (배점 30점 / 권장 8분)
  ============================================
  script.js의 ①~④ 빈칸을 채워 슬라이더가 정상 동작하게 하시오.
  (HTML/CSS는 수정 금지)

  동작 조건:
  1) "다음" 클릭 시 다음 슬라이드로 이동
  2) 마지막 슬라이드에서 "다음" 클릭 시 첫 슬라이드로 순환
  3) 첫 슬라이드에서 "이전" 클릭 시 마지막 슬라이드로 순환

  ※ 빈칸을 채우기 전에는 JS 문법 오류로 동작하지 않는 것이 정상입니다.
-->

<div class="slider">
  <ul class="slide-list">
    <li class="slide">11</li>
    <li class="slide">22</li>
    <li class="slide">33</li>
  </ul>
</div>

<div class="ctrl">
  <button id="btn-prev">이전</button>
  <button id="btn-next">다음</button>
</div>

<script src="script.js"></script>
</body>
</html>
