<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제8. 로그인 폼 (시안 구현)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ============================================
  [문제 8] 시안 구현 (배점 100점 / 제한 30분)
  ============================================
  같은 폴더의 시안.png 를 보고 동일하게 구현하시오.
  HTML은 이 파일에, CSS는 style.css에, JS는 script.js에 작성.

  [스타일 가이드]
  - 페이지        : 배경 #f3f4f6, 로그인 카드는 화면 정중앙(가로+세로)
  - 로그인 카드   : 너비 400px, 흰 배경, 모서리 12px,
                    그림자 0 4px 16px rgba(0,0,0,.1), padding 40px 32px
  - 제목          : "LOGIN" 24px, 중앙, 아래 여백 32px
  - 인풋 2개      : 아이디(텍스트) / 비밀번호(패스워드)
                    너비 100%, 높이 48px, 테두리 1px #d1d5db, 모서리 8px,
                    아래 간격 12px, 포커스 시 테두리 #2563eb
  - 아이디 저장   : 체크박스 + 글자 13px #555
  - 로그인 버튼   : 너비 100%, 높이 48px, 배경 #2563eb, 흰 글자 15px 굵게,
                    모서리 8px, 위 여백 20px, hover 시 #1d4ed8
  - 하단 링크     : 회원가입 / 아이디 찾기 / 비밀번호 찾기
                    13px #888, 중앙 정렬, 사이 구분선(|)은 CSS로 처리
  - 에러 메시지   : 각 인풋 바로 아래, 12px #dc2626
                    (평소엔 비어 있고, 검사 실패 시 문구 표시)

  [JS 요구사항] — script.js에 작성
  1) 로그인 버튼 클릭(또는 Enter) 시 검사 실행, 폼 전송은 차단
  2) 아이디가 비어 있으면 → 아이디 아래에 "아이디를 입력하세요."
     비밀번호가 비어 있으면 → 비밀번호 아래에 "비밀번호를 입력하세요."
     (둘 다 비었으면 두 메시지 동시 표시)
  3) 둘 다 입력됐으면 alert('로그인 성공')
  4) 인풋에 다시 입력을 시작하면 해당 에러 메시지는 지워진다
  힌트: 공백만 입력한 경우도 걸러낼 것

  [채점 기준]
  1) 화면 정중앙 배치 방법                                 - 15점
  2) label-input 연결 등 폼 접근성                         - 15점
  3) 색상·크기·간격 가이드 준수                            - 30점
  4) 유효성 검사 JS 동작                                   - 40점
-->

<!-- TODO: 여기에 마크업을 작성하세요 -->
<main>
    <div class="inner">
        <div class="login_box">
            <h2 class="login_title">LOGIN</h2>
            <form class="login_form" id="loginForm">
                <input type="text" class="input_text" placeholder="아이디" id="inputId">
                <span class="error" id="errorId"></span>
                
                <input type="password" class="input_text" placeholder="비밀번호" id="inputPassword">
                <span class="error" id="errorPassword"></span>
                
                <label class="check_label">
                    <input type="checkbox">
                    <span>아이디 저장</span>
                </label>

        
                    <button class="login_btn" type="submit" id="loginBtn">로그인</button>
          
                
            </form>

            <ul class="info_list">
                <li><a>회원가입</a></li>
                <li><a>아이디 찾기</a></li>
                <li><a>비밀번호 찾기</a></li>
            </ul>
        </div>
    </div>
</main>


</body>
<script src="./script.js"></script>
</html>
