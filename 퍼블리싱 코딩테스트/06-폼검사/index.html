  ============================================
  script.js의 유효성 검사 코드에 오류가 있다. 모두 찾아 수정하시오.

  동작 조건:
  1) 이름이 비어 있으면 "이름을 입력하세요." 표시

-->

<form id="joinForm">
  <input type="text" id="userName" placeholder="이름">
  <p class="err-name"></p>
  <input type="text" id="userEmail" placeholder="이메일">
  <p class="err-email"></p>
  <button type="submit">가입하기</button>
</form>
