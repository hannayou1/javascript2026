<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 상담 신청</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 여기에 마크업 작성 -->
   <main>
    <section>
      <div class="form-box">
        <h2 class="form-title">여행 상담 신청</h2>
        <p class="form-desc">전문 플래너가 연락드립니다</p>
		<form class="inquiry-form" action="">
			<div class="form-field">
				<label for="userName">이름</label>
				<input type="text" id="userName" placeholder="이름을 입력해 주세요"/>
				<p class="error-msg"></p>
			</div>
			<div class="form-field">
				<label for="userEmail">이메일</label>
				<input type="text" id="userEmail" placeholder="이메일을 입력해 주세요"/>
				<p class="error-msg"></p>
			</div>
			<div class="form-agree">
				<input type="checkbox" id="agree"/>
				<label for="agree">개인정보 수집 이용 동의</label>
			</div>
			<button type="submit" class="btn-submit">상담 신청하기</button>

		</form>
	</div>

    </section>
   </main>

  <script src="form.js"></script>
</body>
</html>
