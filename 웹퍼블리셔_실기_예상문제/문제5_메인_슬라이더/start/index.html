<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메인 비주얼 슬라이더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 여기에 마크업 작성 -->
   <main>
    <section>
      <div class="inner">
		<div class="slider">
			<ul class="slide-track">
				<li class="slide slide1">
					<h2 class="slide-title">여름 휴가 특가</h2>
					<p class="slide-desc">동남아 리조트 최대 40% 할인</p>
					<button class="slide-btn">자세히 보기</button>
				</li>
				<li class="slide slide2">
					<h2 class="slide-title">2222여름 휴가 특가</h2>
					<p class="slide-desc">동남아 리조트 최대 40% 할인</p>
					<button class="slide-btn">자세히 보기</button>
				</li>
				<li class="slide slide3">
					<h2 class="slide-title">333여름 휴가 특가</h2>
					<p class="slide-desc">동남아 리조트 최대 40% 할인</p>
					<button class="slide-btn">자세히 보기</button>
				</li>
			</ul>
			<a class="btn-prev" aria-label="이전 슬라이드"><</a>
			<a class="btn-next" aria-label="다음 슬라이드">></a>
			<div class="dot-list">
				<button class="dot is-active" aria-label="1번 슬라이드"></button>
				<button class="dot" aria-label="2번 슬라이드"></button>
				<button class="dot" aria-label="3번 슬라이드"></button>
			</div>
		</div>
	  </div>
    </section>
   </main>

  <script src="slider.js"></script>
</body>
</html>
