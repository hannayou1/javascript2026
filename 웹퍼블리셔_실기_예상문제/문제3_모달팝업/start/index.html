<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웰컴 쿠폰 이벤트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 여기에 마크업 작성 -->
   <main>
    <section>
      <div class="inner">
        <div class="banner_box">
          <h2 class="banner_title">신규 회원 웰컴 쿠폰</h2>
          <p class="banner_desc">지금 가입하면 20% 할인</p>
          <button class="btn-open-modal">쿠폰 받기</button>
        </div>
      </div>
    </section>
   </main>

   <div class="modal-wrap">
      <div class="modal">
        <div class="modal_header">
          <div class="title">웰컴 쿠폰 도착!</div>
          <button class="btn-close-modal">x</button>
        </div>
        <div class="modal_body">
			<div class="contents">
				<strong>20% OFF</strong>
				<p>신규 회원 전용 할인 쿠폰</p>
			</div>
			<button>쿠폰 다운로드</button>
		</div>
      </div>
   </div> 
  <script src="modal.js"></script>
</body>
</html>
